# Standalone workspace-of-one. `vendor/bones` is nested inside this repo and
# its `crates/bones-messages` declares its own workspace (it is built for host
# and WASM guests), so Cargo would see two workspace roots unless excluded.
[workspace]
exclude = ["vendor/bones"]

[package]
name = "game"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "artificial-will"
path = "src/main.rs"

[dependencies]
# The whole engine is one crate (bones ADR-030). Default features bring the
# presentation stack, audio, and game-core; `wasm` hosts our extensions, and
# `devtools` lets BONES_DEVTOOLS_PORT open the inspection channel.
bones-kernel = { path = "vendor/bones/crates/bones-kernel", features = ["wasm", "devtools"] }

[dev-dependencies]
game-messages = { path = "extensions/game-messages" }
